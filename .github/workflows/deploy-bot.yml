# Deploys the LINE bot (bot/) to Cloudflare Workers when its files change. See bot/SETUP.md.
# Needs four repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN.
name: Deploy LINE bot

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stop if Cloudflare isn't set up yet
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || grep -q REPLACE_WITH_KV_NAMESPACE_ID bot/wrangler.toml; then
            echo "Cloudflare secrets or KV id missing; skipping deploy (see bot/SETUP.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.ready.outputs.go == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          secrets: |
            LINE_CHANNEL_SECRET
            LINE_CHANNEL_ACCESS_TOKEN
        env:
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
