# Cloudflare Worker settings for the LINE bot (free plan). See bot/SETUP.md.
name = "food-trace-line-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# Every day at 14:00 UTC (10 am Eastern, 7 am Pacific). Weekly reports go out on Mondays.
[triggers]
crons = ["0 14 * * *"]

# Subscriber settings. Replace the id with the one Cloudflare shows after creating the namespace.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
